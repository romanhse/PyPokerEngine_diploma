[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-research-lab"
version = "0.3.0"
description = "Reproducible research stack for poker agents and LLM evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Roman HSE" }]
keywords = ["poker", "imperfect-information-games", "reinforcement-learning", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "phevaluator==0.5.3.1",
  "pokerkit==0.7.4",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "pyarrow>=16,<23",
  "seaborn>=0.13,<1",
]
training = [
  "gymnasium>=1.0,<2",
  "torch>=2.3,<3",
]
game-theory = [
  "open-spiel==1.6.15",
]
dev = [
  "mock>=5,<6",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
poker-benchmark = "poker_research.cli:main"

[project.urls]
Repository = "https://github.com/romanhse/PyPokerEngine_diploma"

[tool.setuptools.packages.find]
where = ["."]
include = ["pypokerengine*", "poker_research*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["poker_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["poker_research"]

[[tool.mypy.overrides]]
module = [
  "open_spiel.*",
  "phevaluator",
  "pokerkit",
  "pokerkit.*",
  "pyspiel",
  "scipy",
]
ignore_missing_imports = true
